functions:
  oscar:
  - oscar-cluster:
      name: vscode
      image: linuxserver/code-server:latest
      script: script.sh
      cpu: '1.0'
      memory: 1Gi
      environment:
        variables:
          DEFAULT_WORKSPACE: /mnt/workspace
          PASSWORD: password
      # The bucket must already exist; OSCAR mounts it at /mnt/<bucket>.
      mount:
        storage_provider: minio.default
        path: workspace
      volume:
        size: 1Gi
        mount_path: /config
        lifecycle_policy: retain
      expose:
        min_scale: 1
        max_scale: 1
        api_port: [8443]
        cpu_threshold: 90
        default_command: true
        health_path: /healthz