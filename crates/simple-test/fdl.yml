functions:
  oscar:
  - oscar-cluster:
     name: simple-test
     memory: 128Mi
     cpu: '0.2'
     image: ubuntu:22.04
     script: script.sh
     allowed_users: []
     log_level: CRITICAL
     input:
     - storage_provider: minio.default
       path: simple-test/input
     output:
     - storage_provider: minio.default
       path: simple-test/output
