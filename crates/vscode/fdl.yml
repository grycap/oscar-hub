functions:
  oscar:
  - oscar-cluster:
      name: vscode
      image: linuxserver/code-server:latest
      script: script.sh
      cpu: '1.0'
      memory: 1Gi
      environment:
        variables:
          PUID: '1000'
          PGID: '1000'
          TZ: Etc/UTC
          DEFAULT_WORKSPACE: /mnt/workspace
          PASSWORD: password
      # The bucket must already exist; OSCAR mounts it at /mnt/<bucket>.
      mount:
        storage_provider: minio.default
        path: workspace
      expose:
        min_scale: 1
        max_scale: 1
        api_port: [8080]
        cpu_threshold: 90
        health_path: /health
