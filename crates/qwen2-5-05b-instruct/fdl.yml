functions:
  oscar:
  - oscar-model-serving-cluster:
      name: qwen2-5-05b-instruct
      cpu: '2.0'
      memory: 6Gi
      script: script.sh
      model_serving:
        llm_inference:
          runtime_image: ghcr.io/grycap/kserve-vllm-openai-cpu:v0.22.1
          source: "oci://ghcr.io/grycap/kserve-qwen2-5-05b-instruct:latest"
          args:
            - --dtype=auto
            - --enforce-eager
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
      environment:
        variables:
          VLLM_CPU_KVCACHE_SPACE: "1"